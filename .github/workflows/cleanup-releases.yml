name: Clean up old releases

# Started by hand: deletes every release and tag except the one given.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tags to keep, separated by spaces (e.g. v0.5.0 v0.6.0 v0.7.0)"
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete other releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
        run: |
          for k in $KEEP; do
            gh release view "$k" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::$k does not exist"; exit 1; }
          done
          keep() { for k in $KEEP; do [ "$1" = "$k" ] && return 0; done; return 1; }
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
            keep "$tag" && continue
            echo "deleting release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref | sub("refs/tags/"; "")'); do
            keep "$tag" && continue
            echo "deleting tag $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done
